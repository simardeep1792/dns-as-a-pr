trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ui/*
      - ui/**/*
      - azure-pipelines-ui.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - ui/*
      - ui/**/*
      - azure-pipelines-ui.yml

pool:
  vmImage: ubuntu-latest

variables:
  GCP_PROJECT_ID: edip-aurora-fgc
  GAR_REGION: northamerica-northeast1
  GAR_REPOSITORY: dns-as-a-pr
  GAR_IMAGE_NAME: dns-request-ui

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: Use Node.js 20

  - bash: |
      set -euo pipefail
      cd ui
      npm ci
      node src/server.js >/tmp/dns-ui.log 2>&1 &
      pid=$!
      sleep 2
      curl -fsS http://127.0.0.1:8080/api/health
      kill "$pid"
    displayName: Smoke test UI API

  - task: Docker@2
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      command: buildAndPush
      containerRegistry: $(GAR_DOCKER_SERVICE_CONNECTION)
      Dockerfile: ui/Dockerfile
      repository: $(GAR_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(GAR_REPOSITORY)/$(GAR_IMAGE_NAME)
      buildContext: ui
      tags: |
        main
        $(Build.SourceVersion)
    displayName: Build and push UI container to GAR

  - bash: |
      set -euo pipefail
      if [ "$(Build.SourceBranch)" != "refs/heads/main" ]; then
        echo "Skipping deployment manifest image update on non-main branch"
        exit 0
      fi

      IMAGE="$(GAR_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(GAR_REPOSITORY)/$(GAR_IMAGE_NAME):$(Build.SourceVersion)"
      python3 - <<'PY'
      from pathlib import Path
      import os
      import re

      path = Path("k8s/apps/dns-request-ui/deployment.yaml")
      content = path.read_text()
      image = os.environ["IMAGE"]
      updated = re.sub(
          r"image:\s*[^\s]+",
          f"image: {image}",
          content,
          count=1,
      )
      path.write_text(updated)
      PY

      if git diff --quiet -- k8s/apps/dns-request-ui/deployment.yaml; then
        echo "No deployment image update needed"
        exit 0
      fi

      git add k8s/apps/dns-request-ui/deployment.yaml
      git -c user.name='azure-pipelines[bot]' -c user.email='azure-pipelines@local' commit -m "chore: pin dns-request-ui image to $(Build.SourceVersion)"
      git push origin HEAD:main
    env:
      IMAGE: $(GAR_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(GAR_REPOSITORY)/$(GAR_IMAGE_NAME):$(Build.SourceVersion)
    displayName: Update deployment image tag
