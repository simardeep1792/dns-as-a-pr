trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ui/*
      - ui/**/*
      - azure-pipelines-ui.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - ui/*
      - ui/**/*
      - azure-pipelines-ui.yml

pool:
  vmImage: ubuntu-latest

variables:
  GCP_PROJECT_ID: edip-aurora-fgc
  GAR_REGION: northamerica-northeast1
  GAR_REPOSITORY: dns-as-a-pr
  GAR_IMAGE_NAME: dns-request-ui
  GAR_PUSH_ENABLED: 'true'

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: Use Node.js 20

  - bash: |
      set -euo pipefail
      cd ui
      npm ci
      node src/server.js >/tmp/dns-ui.log 2>&1 &
      pid=$!
      sleep 2
      curl -fsS http://127.0.0.1:8080/api/health
      kill "$pid"
    displayName: Smoke test UI API

  - bash: |
      set -euo pipefail
      IMAGE="$(GAR_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(GAR_REPOSITORY)/$(GAR_IMAGE_NAME)"
      docker build -f ui/Dockerfile -t "$IMAGE:$(Build.SourceVersion)" -t "$IMAGE:main" ui
    displayName: Build UI container image

  - bash: |
      set -euo pipefail
      if [ "$(Build.SourceBranch)" != "refs/heads/main" ] || [ "$(GAR_PUSH_ENABLED)" != "true" ]; then
        echo "Skipping registry push"
        exit 0
      fi

      : "${GAR_REGISTRY_USERNAME:?GAR_REGISTRY_USERNAME is required when GAR_PUSH_ENABLED=true}"
      : "${GAR_REGISTRY_PASSWORD:?GAR_REGISTRY_PASSWORD is required when GAR_PUSH_ENABLED=true}"

      IMAGE="$(GAR_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(GAR_REPOSITORY)/$(GAR_IMAGE_NAME)"
      echo "$GAR_REGISTRY_PASSWORD" | docker login -u "$GAR_REGISTRY_USERNAME" --password-stdin "https://$(GAR_REGION)-docker.pkg.dev"
      docker push "$IMAGE:$(Build.SourceVersion)"
      docker push "$IMAGE:main"
    displayName: Push UI container image to GAR
