<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DNS Request UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="header-card">
        <p class="eyebrow">dns-as-a-pr</p>
        <h1>DNS Request UI</h1>
        <p>Generate validated DNSEndpoint YAML and open a pull request through the provider adapter.</p>
      </section>

      <section class="panel-grid">
        <form id="request-form" class="panel">
          <h2>Request</h2>

          <label>Subdomain<input name="subdomain" required placeholder="blog" /></label>

          <label>Record Type
            <select name="recordType" required>
              <option>A</option>
              <option>AAAA</option>
              <option>CNAME</option>
              <option>TXT</option>
              <option>NS</option>
            </select>
          </label>

          <label>TTL<input name="recordTTL" type="number" min="1" value="300" required /></label>
          <label>Owner<input name="owner" required placeholder="platform" /></label>
          <label>Targets (one per line)
            <textarea name="targets" rows="5" required placeholder="203.0.113.10"></textarea>
          </label>

          <div class="actions">
            <button type="button" id="preview-btn">Preview YAML</button>
            <button type="submit" id="submit-btn">Open Pull Request</button>
          </div>
        </form>

        <section class="panel output-panel">
          <h2>Preview</h2>
          <p id="meta" class="meta">Fill the form and preview before submitting.</p>
          <pre id="yaml-preview"></pre>
          <p id="result" class="result"></p>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
