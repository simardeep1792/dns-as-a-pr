name: UI Image

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-image.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-image.yml"

jobs:
  build:
    name: Build UI container
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/simardeep1792/dns-request-ui:main
            ghcr.io/simardeep1792/dns-request-ui:${{ github.sha }}

      - name: Update deployment image tag
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/apps/dns-request-ui/deployment.yaml")
          content = path.read_text()
          sha = os.environ["GITHUB_SHA"]
          updated = re.sub(
              r"image:\s*ghcr\.io/simardeep1792/dns-request-ui:[^\s]+",
              f"image: ghcr.io/simardeep1792/dns-request-ui:{sha}",
              content,
              count=1,
          )
          path.write_text(updated)
          PY

      - name: Commit deployment image update
        if: ${{ github.event_name == 'push' }}
        run: |
          if git diff --quiet -- k8s/apps/dns-request-ui/deployment.yaml; then
            echo "No deployment image update needed"
            exit 0
          fi
          git add k8s/apps/dns-request-ui/deployment.yaml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: pin dns-request-ui image to ${GITHUB_SHA}"
          git push
