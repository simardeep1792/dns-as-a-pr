name: UI Image

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-image.yml"
      - "k8s/apps/dns-request-ui/**"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-image.yml"
      - "k8s/apps/dns-request-ui/**"

jobs:
  build:
    name: Build UI container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/simardeep1792/dns-request-ui:main
            ghcr.io/simardeep1792/dns-request-ui:${{ github.sha }}
