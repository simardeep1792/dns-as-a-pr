name: DNS Records Validation

on:
  pull_request:
    paths:
      - "dns-records/**"
      - "policies/dns/**"
      - "schemas/**"

jobs:
  validate:
    name: Validate DNSEndpoint manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (yamllint, kubeconform, conftest)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint==1.35.1

          curl -sSL -o /usr/local/bin/kubeconform https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64
          chmod +x /usr/local/bin/kubeconform

          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.57.0/conftest_0.57.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - name: Validate YAML syntax (line/col)
        run: |
          yamllint -f parsable dns-records

      - name: Validate DNSEndpoint schema (kubeconform)
        run: |
          kubeconform \
            -strict \
            -schema-location default \
            -schema-location "file://$(pwd)/schemas" \
            dns-records

      - name: Policy checks (Conftest / OPA)
        run: |
          conftest test -p policies/dns --all-namespaces dns-records
