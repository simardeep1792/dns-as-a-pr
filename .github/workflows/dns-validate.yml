name: DNS Records Validation

on:
  push:
    branches: [main]
    paths:
      - "dns-records/**"
      - "schemas/**"
      - "scripts/validate-dns.sh"
  pull_request:
    paths:
      - "dns-records/**"
      - "schemas/**"
      - "scripts/validate-dns.sh"

jobs:
  validate:
    name: Validate DNSEndpoint manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (yamllint, kubeconform)
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint==1.35.1

          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate DNS records
        run: scripts/validate-dns.sh
