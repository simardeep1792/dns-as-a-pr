name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/validate-infra.sh"
  pull_request:
    paths:
      - "infra/**"
      - "scripts/validate-infra.sh"

jobs:
  validate:
    name: OpenTofu fmt/validate/plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA_EMAIL }}

      - name: Validate infrastructure
        run: scripts/validate-infra.sh

      - name: OpenTofu plan
        id: plan
        working-directory: infra/envs/poc
        run: |
          tofu plan -no-color -input=false \
            -var "authorized_cidr=203.0.113.4/32" \
            | tee plan.txt

      - name: Comment plan summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              '## OpenTofu Plan',
              '',
              'This plan uses GitHub OIDC to authenticate to GCP. It never applies.',
              '',
              '```',
              fs.readFileSync('infra/envs/poc/plan.txt', 'utf8').slice(0, 60000),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
