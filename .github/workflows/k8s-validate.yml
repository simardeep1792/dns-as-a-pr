name: Kubernetes Manifests Validation

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "schemas/**"
      - ".yamllint.yml"
      - "scripts/validate-k8s.sh"
  pull_request:
    paths:
      - "k8s/**"
      - "schemas/**"
      - ".yamllint.yml"
      - "scripts/validate-k8s.sh"

jobs:
  validate:
    name: yamllint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (yamllint, kubeconform)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint==1.35.1

          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: scripts/validate-k8s.sh
