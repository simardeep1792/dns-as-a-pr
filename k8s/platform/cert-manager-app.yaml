apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.15.3
    helm:
      values: |
        installCRDs: true

        # GKE Autopilot restricts writes to kube-system. cert-manager defaults leader election there.
        global:
          leaderElection:
            namespace: cert-manager

        leaderElection:
          namespace: cert-manager

        # Ensure all cert-manager components avoid kube-system for leader election (GKE Autopilot restriction).
        extraArgs:
          - --leader-election-namespace=cert-manager

        serviceAccount:
          create: true
          name: cert-manager
          annotations:
            iam.gke.io/gcp-service-account: cert-manager@edip-aurora-fgc.iam.gserviceaccount.com
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        webhook:
          leaderElection:
            namespace: cert-manager
          extraArgs:
            - --leader-election-namespace=cert-manager
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        cainjector:
          leaderElection:
            namespace: cert-manager
          extraArgs:
            - --leader-election-namespace=cert-manager
          resources:
            requests:
              cpu: 25m
              memory: 64Mi

        startupapicheck:
          leaderElection:
            namespace: cert-manager
          extraArgs:
            - --leader-election-namespace=cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
