apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.15.3
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: cert-manager
          annotations:
            iam.gke.io/gcp-service-account: cert-manager@edip-aurora-fgc.iam.gserviceaccount.com
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        cainjector:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
