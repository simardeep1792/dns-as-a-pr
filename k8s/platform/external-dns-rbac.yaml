apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns-dnsendpoint-reader
  namespace: dns
rules:
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns-dnsendpoint-reader
  namespace: dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns-dnsendpoint-reader
