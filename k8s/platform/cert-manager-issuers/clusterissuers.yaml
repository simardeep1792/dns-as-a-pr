    email: simardeep+acme@simardeep.xyz
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-dns01
    solvers:
      - dns01:
          cloudDNS:
            project: edip-aurora-fgc
