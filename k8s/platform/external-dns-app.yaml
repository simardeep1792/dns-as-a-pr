apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    # Ensure the DNSEndpoint CRD is installed before dns-records syncs.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      values: |
        provider: google
        sources:
          - crd
        # Safer default for a PR-driven registry: don’t delete records on drift.
        policy: upsert-only
        registry: txt
        txtOwnerId: simardeep-xyz
        # Avoid TXT registry collisions with user-managed TXT records.
        txtPrefix: edns-
        logLevel: debug
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            iam.gke.io/gcp-service-account: external-dns@edip-aurora-fgc.iam.gserviceaccount.com
        extraArgs:
          - --namespace=dns
          - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
          - --crd-source-kind=DNSEndpoint
          - --managed-record-types=A,AAAA,CNAME,TXT,MX,NS
          - --google-project=edip-aurora-fgc
        rbac:
          create: true
          additionalPermissions:
            - apiGroups: ["externaldns.k8s.io"]
              resources: ["dnsendpoints"]
              verbs: ["get", "watch", "list"]
            - apiGroups: ["externaldns.k8s.io"]
              resources: ["dnsendpoints/status"]
              verbs: ["update", "patch"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
