apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.18.6
    helm:
      values: |
        crds:
          enabled: true
        leaderElection:
          namespace: cert-manager
        replicaCount: 1
        prometheus:
          enabled: false
        serviceAccount:
          create: true
          name: cert-manager
          annotations:
            iam.gke.io/gcp-service-account: cert-manager@edip-aurora-fgc.iam.gserviceaccount.com
        cainjector:
          enabled: true
        webhook:
          replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
