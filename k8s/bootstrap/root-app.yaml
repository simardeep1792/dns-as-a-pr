apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simardeep-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/simardeep1792/dns-as-a-pr.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
