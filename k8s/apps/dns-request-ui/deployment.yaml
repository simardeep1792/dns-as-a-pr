apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-request-ui
  namespace: dns-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-request-ui
  template:
    metadata:
      labels:
        app: dns-request-ui
    spec:
      containers:
        - name: dns-request-ui
          image: northamerica-northeast1-docker.pkg.dev/edip-aurora-fgc/dns-as-a-pr/dns-request-ui:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GIT_PROVIDER_MODE
              value: azure-devops
            - name: GIT_BASE_BRANCH
              value: main
            - name: AZDO_ORGANIZATION
              value: EDIP-PIDE
            - name: AZDO_PROJECT
              value: dns-as-a-pr
            - name: AZDO_REPOSITORY
              value: dns-as-a-pr
            - name: AZDO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dns-request-ui-secrets
                  key: azdo-token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
