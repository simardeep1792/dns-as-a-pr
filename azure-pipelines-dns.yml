trigger:
  branches:
    include:
      - main
  paths:
    include:
      - dns-records/*
      - scripts/validate-dns.sh
      - scripts/validate-dns-metadata.py

pr:
  branches:
    include:
      - main
  paths:
    include:
      - dns-records/*
      - scripts/validate-dns.sh
      - scripts/validate-dns-metadata.py

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail
      sudo pip3 install yamllint
      curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
      tar -xzf /tmp/kubeconform.tar.gz -C /tmp
      chmod +x /tmp/kubeconform
      KUBECONFORM_BIN=/tmp/kubeconform scripts/validate-dns.sh
    displayName: Validate DNS manifests
